<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc"><title id="title">A Householder transform microbenchmark: PyTorch and Triton</title><desc id="desc">Forward and backward median elapsed time was 65.79 milliseconds for the PyTorch loop and 2.49 milliseconds for Triton rotations. Peak extra allocated GPU memory was 895.3 and 36.3 MiB respectively. One RTX 4070 Laptop, float32, 192 reflections per rotation.</desc><rect width="1440" height="800" rx="20" fill="#101a27"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="72" y="55" fill="#60d9c0" font-size="19" font-weight="700" letter-spacing="2">FERN  /  GPU ENGINEERING</text><text x="72" y="108" fill="#f3f7fb" font-size="37" font-weight="700">Householder transform: a measured optimization</text><text x="72" y="147" fill="#b4c2d3" font-size="20" >Historical microbenchmark · RTX 4070 Laptop · float32 · 192 reflections per rotation</text><text x="72" y="207" fill="#f3f7fb" font-size="21" font-weight="700">MEDIAN FORWARD + BACKWARD TIME (ms)</text><text x="1365" y="207" fill="#60d9c0" font-size="21" text-anchor="end" font-weight="700">26.42× time ratio</text><text x="72" y="259" fill="#c1cedc" font-size="18" >PyTorch loop</text><rect x="250" y="237" width="822.375" height="30" rx="6" fill="#8093a8"/><text x="1087.375" y="259" fill="#f3f7fb" font-size="20" font-weight="700">65.79 ms</text><text x="72" y="312" fill="#c1cedc" font-size="18" >Triton rotations</text><rect x="250" y="290" width="31.125" height="30" rx="6" fill="#60d9c0"/><text x="296.125" y="312" fill="#f3f7fb" font-size="20" font-weight="700">2.49 ms</text><line x1="250" y1="338" x2="1250" y2="338" stroke="#708297"/><line x1="250" y1="338" x2="250" y2="346" stroke="#708297"/><text x="250" y="369" fill="#9fb0c3" font-size="17" text-anchor="middle">0</text><line x1="500" y1="338" x2="500" y2="346" stroke="#708297"/><text x="500" y="369" fill="#9fb0c3" font-size="17" text-anchor="middle">20</text><line x1="750" y1="338" x2="750" y2="346" stroke="#708297"/><text x="750" y="369" fill="#9fb0c3" font-size="17" text-anchor="middle">40</text><line x1="1000" y1="338" x2="1000" y2="346" stroke="#708297"/><text x="1000" y="369" fill="#9fb0c3" font-size="17" text-anchor="middle">60</text><line x1="1250" y1="338" x2="1250" y2="346" stroke="#708297"/><text x="1250" y="369" fill="#9fb0c3" font-size="17" text-anchor="middle">80</text><text x="72" y="430" fill="#f3f7fb" font-size="21" font-weight="700">PEAK EXTRA ALLOCATED GPU MEMORY (MiB)</text><text x="1365" y="430" fill="#60d9c0" font-size="21" text-anchor="end" font-weight="700">24.66× allocation ratio</text><text x="72" y="482" fill="#c1cedc" font-size="18" >PyTorch loop</text><rect x="250" y="460" width="895.3" height="30" rx="6" fill="#8093a8"/><text x="1160.3" y="482" fill="#f3f7fb" font-size="20" font-weight="700">895.3 MiB</text><text x="72" y="535" fill="#c1cedc" font-size="18" >Triton rotations</text><rect x="250" y="513" width="36.30000000000001" height="30" rx="6" fill="#60d9c0"/><text x="301.3" y="535" fill="#f3f7fb" font-size="20" font-weight="700">36.3 MiB</text><line x1="250" y1="561" x2="1250" y2="561" stroke="#708297"/><line x1="250" y1="561" x2="250" y2="569" stroke="#708297"/><text x="250" y="592" fill="#9fb0c3" font-size="17" text-anchor="middle">0</text><line x1="500" y1="561" x2="500" y2="569" stroke="#708297"/><text x="500" y="592" fill="#9fb0c3" font-size="17" text-anchor="middle">250</text><line x1="750" y1="561" x2="750" y2="569" stroke="#708297"/><text x="750" y="592" fill="#9fb0c3" font-size="17" text-anchor="middle">500</text><line x1="1000" y1="561" x2="1000" y2="569" stroke="#708297"/><text x="1000" y="592" fill="#9fb0c3" font-size="17" text-anchor="middle">750</text><line x1="1250" y1="561" x2="1250" y2="569" stroke="#708297"/><text x="1250" y="592" fill="#9fb0c3" font-size="17" text-anchor="middle">1000</text><line x1="72" y1="630" x2="1368" y2="630" stroke="#34465a"/><text x="72" y="670" fill="#d1dce8" font-size="18" >Rotate → scale → rotate back, with gradients of input, vectors and scale.</text><text x="72" y="704" fill="#b4c2d3" font-size="17" >Input [95, 32, 1, 1, 192] · median of 15 synchronized calls after 3 warm-ups.</text><text x="72" y="738" fill="#b4c2d3" font-size="17" >Single workload and GPU · measured 2026-10-13 · not end-to-end model or training speed.</text></g></svg>